<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="container">
        <p>Hello</p>
    </div>

    <div class="containerFluid">
        
    </div>
    <script>
        const container = document.querySelector("#container");
        const containerFluid = document.querySelector(".containerFluid");
        
        let p = document.createElement('p');
        let h1 = document.createElement('h1');
        let p1 = document.createElement('p');
        let p2 = document.createElement('p');
        let after = document.createElement('h1');


        h1.innerText = "Heading";
        p.innerText = "World";
        p1.innerText = "first";
        p2.innerText = "before";
        after.innerText = "after";

        container.append(h1,p); // can add more them one element
        containerFluid.appendChild(h1,p); // can not add more them one element
        containerFluid.prepend(p1); // add from starting
        h1.before(p2); // add before 
        h1.after(after);


    </script>
</body>

</html>
